name: neuromotion
description: NeuroMotion - AI gait analysis app for North Shore Private Hospital.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.2.7
  camera: ^0.11.0+2
  path_provider: ^2.1.4
  fl_chart: ^0.69.0
  video_player: ^2.9.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
